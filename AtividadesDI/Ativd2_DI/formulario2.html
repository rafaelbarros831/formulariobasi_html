<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário-2</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">


</head>
<body class="bg-dark text-white">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

<br>

<a href="index.html" class="btn btn-primary" target="_blank">Voltar para a página principal</a>
    
<br>

<hr class="border-primary">

<br>

<form action="">
    <fieldset id ="formulario2_id">

        <legend class="float-none w-auto px-2 fs-5 fw-bold text-primary">Indentificação de Usuário</legend>
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome_id" placeholder="Nome Completo">

        <br>
        <br>

        <label for="senha">Senha:</label>
        <input type="password" name="senha" id="senha_id" placeholder="Digite a senha">
        
        <br>
        <br>

        <label for="email">E-mail:</label>
        <input type="email" name="email" id="email_id" placeholder="digite o seu e-mail">
        <br>
        <br>

        <fieldset>
            <legend class="float-none w-auto px-2 fs-5 fw-bold text-primary">Sexo:</legend>
            <input type="radio" name="sexoM" id="masculino_id" value="masculino">
            <label for="masculino_id">Masculino</label>
            <br>
            <input type="radio" name="sexoF" id="feminino_id" value="feminino">
            <label for="feminino_id">Feminino</label>
        </fieldset>

        <br>

        <label for="data_nascimento_id">Data de Nascimento</label>
        <input type="date" name="data_nascimento" id="data_nascimento_id">

        <br>

    </fieldset>

    <fieldset>

        <legend class="float-none w-auto px-2 fs-5 fw-bold text-primary">Endereço</legend>   

        <br>

        <label for="Logradouro_id">Logradouro:</label>
        <input type="text" name="Logradouro" id="Logradouro_id" placeholder="Rua, Av, Bairro"><br><br>
        <label for="Numero_id">Número:</label>
        <input type="text" name="Numero" id="Numero_id" placeholder="Número" size="10"><br><br>
        <label for="Estado_id">Estado:</label>
        <select name="Estado" id="Estado_id">
            
            <option value="RJ">Rio de Janeiro</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RO">Rondônia</option>
            <option value="RR">Roraima</option>
            <option value="SC">Santa Catarina</option>
            <option value="SP" selected>São Paulo</option>
            <option value="SE">Sergipe</option>
            <option value="TO">Tocantins</option>

        </select><br><br>

        <label for="Cidade_id">Cidade:</label>
        <input type="text" name="Cidade" id="Cidade_id" placeholder="Sua cidade"><br><br>

    </fieldset>

    <br>

    <fieldset>

        <legend class="float-none w-auto px-2 fs-5 fw-bold text-primary">Mensagem do Usuário</legend>
        <br>

        <label for="urgencia_id">Grau de Urgência:</label>
       Min <input type="range" name="urgencia" id="urgencia_id" min="0" max="10" step="1"> Max 

       <br>
       <br>

        <label for="mensagem_id">Mensagem:</label>
        <textarea name="mensagem" id="mensagem_id" cols="30" rows="5"></textarea>
        <br>

    </fieldset>

    <fieldset>
        <legend class="float-none w-auto px-2 fs-5 fw-bold text-primary"><b>Quero um produto</b></legend>
        <br>

        <input type="checkbox" name="produto" id="produto_id">
        <label for="produto_id">Gostaria de adquirir um produto quando disponível.</label>
        <br>
        <br>

        <label for="cor_id">Cor:</label>
        <input type="color" name="cor" id="cor_id">
        <br>
        <br>

        <label for="quantidade_id">Quantidade:</label>
        <input type="number" name="quantidade" id="quantidade_id" min="1" value="1">
        <br>
        <br>

        <label for="preco_id">Preço Total R$:</label>
        <input type="text" name="preco" id="preco_id">
        <br>
        <br>

    </fieldset>

<br>

    <input type="submit" value="Enviar" class="btn btn-primary btn-sm">

<br>

</form>

</body>
</html>
