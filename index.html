<!DOCTYPE html>

<html>

<head>

<title>Formulário</title>

</head>

<body>
 
  <br>
<img src = "catfuny.jpg" width="200" height"100">
  <br>

<h1>Preencha o formulário:</h1>

<form action="/registro" method="POST">

<label for="nome">Nome:</label>
<input type="text" name="nome" placeholder="Informe seu nome" />
 <br>
<label for="email">E-mail:</label>
<input type="email" name="email" placeholder="Informe seu E-mail" />
 <br>
<label for="senha">Senha:</label>
<input type="password" name="senha" placeholder="Digite a sua senha" />
 <br>
<label for="data_nascimento">Data de Nascimento:</label>
<input type ="date" name="data_nascimento" />

 <br>

<h3>Se você gosta  de torta, responda que SIM, se não marque a opção NÃO.</h3>
<br>
<p>Opções:</p>

 <br>

<input type="radio" name="opcoes" value="Sim" />
<label for="Sim">Sim</label>

<input = type="radio" name="opcoes" value="Não" />
<label for "Não">Não</label> 
 <br>
<p>Interesses:</p>
<input type="checkbox" name="interesses" "Inglês" />
<label for="Inglês">Inglês</label>
<input type="checkbox" name="interesses" "Espanhol" />
<label for="Espanhol">Espanhol</label>
<input type="checkbox" name="interesses" "Chocolate" />
<label for="Chocolate">Chocolate</label>

<p>Insira um número:</p>
<input type="number" name="numero" id="numero"
 
<br>

 <label for="jogos">Jogos:</label>
 <select name="jogos">
  <option value="">Qual você prefere?</option>
  <option value="zelda">Zelda</option>
  <option value="Mario">Mario</option>
  <option value="Donkey Kong">Donkey Kong</option>
   

  </select>

<br>
<br>

<label for="mensagem">Mensagem</label>
<textarea name = "mensagem" placeholder="O que você achou do sistema?"></textarea>

<div>

<button type="submit">Enviar</button>

</div>

</form>


</body>


</html>
